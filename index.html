<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    #videoScreen {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: black;
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }

    #arVideo {
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
      background: black;
    }

    #closeButton {
      position: fixed;
      top: max(18px, env(safe-area-inset-top));
      right: 18px;
      z-index: 100000;
      width: 46px;
      height: 46px;
      border: 0;
      border-radius: 50%;
      background: rgba(0,0,0,.65);
      color: white;
      font-size: 28px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="videoScreen">
    <video
      id="arVideo"
      playsinline
      webkit-playsinline
      preload="auto">
    </video>

    <button id="closeButton">×</button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-camera
      position="0 0 0"
      look-controls="enabled: false">
    </a-camera>

    <a-entity id="snakeTarget"
              mindar-image-target="targetIndex: 0">
    </a-entity>

    <a-entity id="beetleTarget"
              mindar-image-target="targetIndex: 1">
    </a-entity>

    <a-entity id="henryTarget"
              mindar-image-target="targetIndex: 2">
    </a-entity>

  </a-scene>

  <script>
    const snakeTarget = document.querySelector("#snakeTarget");
    const beetleTarget = document.querySelector("#beetleTarget");
    const henryTarget = document.querySelector("#henryTarget");

    const videoScreen = document.querySelector("#videoScreen");
    const video = document.querySelector("#arVideo");
    const closeButton = document.querySelector("#closeButton");

    let launched = false;

    async function playARVideo(filename) {
      if (launched) return;

      launched = true;

      video.pause();
      video.src = filename;
      video.load();
      video.currentTime = 0;

      videoScreen.style.display = "flex";

      try {
        await video.play();

        if (video.requestFullscreen) {
          await video.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }
      } catch (error) {
        console.log("Fullscreen/autoplay restricted:", error);
      }
    }

    snakeTarget.addEventListener("targetFound", () => {
      playARVideo("./snake.mp4?v=3");
    });

    beetleTarget.addEventListener("targetFound", () => {
      playARVideo("./beetle.mp4?v=1");
    });

    henryTarget.addEventListener("targetFound", () => {
      playARVideo("./henry.mp4?v=1");
    });

    video.addEventListener("ended", () => {
      video.pause();
      video.removeAttribute("src");
      video.load();
      videoScreen.style.display = "none";
      launched = false;
    });

    closeButton.addEventListener("click", async () => {
      video.pause();
      video.currentTime = 0;
      video.removeAttribute("src");
      video.load();

      videoScreen.style.display = "none";
      launched = false;

      if (document.fullscreenElement) {
        try {
          await document.exitFullscreen();
        } catch (error) {}
      }
    });
  </script>

</body>
</html>

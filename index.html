<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Brown Tree Snake AR</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.2/dist/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; background:#000; }
    #hint { position: fixed; z-index: 10; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.65); color:#fff; padding:10px 14px; border-radius:10px; text-align:center; font-size:14px; max-width:86%; }
  </style>
</head>
<body>
  <div id="hint">Allow camera access, then point your phone at the brown tree snake image.</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.0001; filterBeta: 0.01;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="snakeVideo" src="./snake.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="snakeTarget" mindar-image-target="targetIndex: 0">
      <a-video
        src="#snakeVideo"
        position="0 0 0.02"
        width="1"
        height="0.5625"
        rotation="0 0 0">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const video = document.querySelector('#snakeVideo');
    const target = document.querySelector('#snakeTarget');
    const hint = document.querySelector('#hint');

    target.addEventListener('targetFound', async () => {
      hint.textContent = 'INVASIVE SPECIES DETECTED';
      try {
        video.currentTime = 0;
        await video.play();
      } catch (e) {
        hint.textContent = 'Tap the screen once, then point back at the snake.';
      }
    });

    target.addEventListener('targetLost', () => {
      video.pause();
      video.currentTime = 0;
      hint.textContent = 'Point your phone at the brown tree snake image.';
    });

    document.body.addEventListener('click', () => video.play().catch(() => {}), { once: true });
  </script>
</body>
</html>
